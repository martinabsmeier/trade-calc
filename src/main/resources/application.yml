albion:
  api:
    base-url: https://west.albion-online-data.com
    server: europe
    locations:
      - Lymhurst
      - Fort Sterling
      - Martlock
      - Bridgewatch
      - Thetford
    qualities:
      - 1

cache:
  market:
    refresh-interval: PT5M
    ttl: PT15M
    max-items: 5000

spring:
  application:
    name: trade-calc
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=${cache.market.max-items},expireAfterWrite=${cache.market.ttl}
    cache-names:
      - marketPrices
      - recipes
      - cityBonuses

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches,metrics
  endpoint:
    health:
      show-details: when-authorized
    caches:
      enabled: true

server:
  port: 8080