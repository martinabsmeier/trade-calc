<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Partial fragment returned by GET /plan — HTMX / fetch inserts the inner
  <div> only. The surrounding <html> is stripped client-side, so this
  template is safe to return as a full document fragment.
-->
<body>
<div th:if="${plan == null}" class="alert alert-warning small mb-0">
    No crafting plan available for <span th:text="${itemId}">T4_BOW</span>.
</div>
<div th:if="${plan != null}">
    <h6 class="mb-2">
        Plan for <span th:text="${itemId}">T4_BOW</span>
        <small class="text-muted">
            · Profit
            <span class="text-success"
                  th:text="${#numbers.formatDecimal(plan.profitSummary.profit, 0, 2)}">0</span>
            silver
        </small>
    </h6>
    <ol class="list-group list-group-numbered list-group-flush">
        <li th:each="step : ${plan.steps}" class="list-group-item d-flex justify-content-between align-items-start">
            <div class="ms-2 me-auto">
                <div class="fw-semibold">
                    <span class="badge text-bg-secondary me-2" th:text="${step.step}">BUY</span>
                    <span th:text="${step.itemId}">T4_WOOD</span>
                    <span class="text-muted">×<span th:text="${step.quantity}">1</span></span>
                </div>
                <small class="text-muted" th:text="${step.city}">Lymhurst</small>
            </div>
        </li>
    </ol>
</div>
</body>
</html>
