<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('trade-calc – Dashboard')}"></head>
<body class="bg-body-tertiary">
<nav th:replace="~{layout :: nav}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card">
                <div class="card-header">
                    <h1 class="h4 mb-0">Crafting profit calculator</h1>
                </div>
                <div class="card-body">
                    <form th:action="@{/}" th:object="${form}" method="post" class="vstack gap-3">
                        <div>
                            <label for="homeCity" class="form-label">Home city</label>
                            <select id="homeCity" th:field="*{homeCity}" class="form-select" required>
                                <option th:each="city : ${cities}" th:value="${city}" th:text="${city}">Lymhurst</option>
                            </select>
                        </div>
                        <div>
                            <label for="mode" class="form-label">Calculation mode</label>
                            <select id="mode" th:field="*{mode}" class="form-select" required>
                                <option th:each="m : ${modes}" th:value="${m.name()}" th:text="${m.description}">Mode</option>
                            </select>
                        </div>
                        <div>
                            <label for="top" class="form-label">Top items</label>
                            <input id="top" type="number" min="1" max="500" th:field="*{top}" class="form-control"/>
                            <div class="form-text">Maximum number of ranked items. Default: 20.</div>
                        </div>
                        <div class="form-check">
                            <input id="includePlan" type="checkbox" th:field="*{includePlan}" class="form-check-input"/>
                            <label for="includePlan" class="form-check-label">Include crafting plan in every row</label>
                            <div class="form-text">Plans are normally loaded on demand via HTMX when a row is expanded.</div>
                        </div>
                        <button type="submit" class="btn btn-primary">Calculate</button>
                    </form>
                </div>
            </div>
            <p class="text-muted small mt-3 mb-0">
                Market prices are sourced live from <code>albion-online-data.com</code>
                and cached for 15&nbsp;minutes.
            </p>
        </div>
    </div>
</main>
</body>
</html>
