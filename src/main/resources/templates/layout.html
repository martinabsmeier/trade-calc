<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  Shared layout fragments used by the other templates. Spring will resolve
  ~{layout :: head} and ~{layout :: nav} via the Thymeleaf view resolver.
-->
<head th:fragment="head(title)">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">trade-calc</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/site.css}"/>
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-md bg-body border-bottom">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">trade-calc</a>
        <div class="navbar-text small text-muted">Albion Online crafting helper</div>
    </div>
</nav>
</body>
</html>
