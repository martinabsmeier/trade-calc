name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache build recipe data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: albion-bin-dumps-${{ hashFiles('scripts/build_recipes.py') }}
          restore-keys: |
            albion-bin-dumps-

      - name: Fetch raw recipe data
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p data/raw
          curl -fsSL -o data/raw/items.json \
            https://raw.githubusercontent.com/ao-data/ao-bin-dumps/master/items.json
          # localization.json is ~90 MB; only needed when rebuilding recipes. Skip
          # from the build pipeline to keep CI fast — recipes.json is committed.

      - name: Build recipes
        run: python3 scripts/build_recipes.py

      - name: Verify (compile + unit + integration tests + coverage gates)
        run: mvn -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 14
