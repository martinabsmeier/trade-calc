# CI: regenerate recipes.json from the ao-bin-dumps raw data, then verify.
# The raw dumps (~110 MB) are cached in data/raw/ and only downloaded when missing.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore raw dump cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: ao-bin-dumps-v1

      - name: Download ao-bin-dumps (items.json + localization.json) if not cached
        run: |
          mkdir -p data/raw
          curl -fL --retry 3 -o data/raw/items.json \
            https://github.com/ao-data/ao-bin-dumps/raw/master/items.json
          curl -fL --retry 3 -o data/raw/localization.json \
            https://github.com/ao-data/ao-bin-dumps/raw/master/localization.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate recipes.json
        run: python3 -I scripts/build_recipes.py

      - name: Commit regenerated recipes.json if changed
        run: |
          if ! git diff --quiet -- src/main/resources/data/recipes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/main/resources/data/recipes.json
            git commit -m "chore(data): regenerate recipes.json from ao-bin-dumps [skip ci]"
            git push
          fi

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify
        run: mvn --batch-mode verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7